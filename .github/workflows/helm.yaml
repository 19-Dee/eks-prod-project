name: Deploy EKS Platform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_REGION: eu-west-2
      EKS_CLUSTER_NAME: threat-composer-eks
      EXTERNAL_DNS_ROLE_ARN: arn:aws:iam::142969859154:role/external-dns
      DOMAIN: devopsbydishen.shop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142969859154:role/eks-threat-composer-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Add Helm repositories
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install NGINX Ingress Controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"=internet-facing \
            --wait \
            --timeout 10m

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 10m

      - name: Configure Let's Encrypt ClusterIssuer
        run: |
          cat <<'ISSUER' | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-prod
          spec:
            acme:
              email: 19dishen@gmail.com
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: letsencrypt-prod
              solvers:
                - http01:
                    ingress:
                      class: nginx
          ISSUER

      - name: Configure ExternalDNS service account
        run: |
          kubectl create namespace external-dns --dry-run=client -o yaml | kubectl apply -f -
          kubectl create serviceaccount external-dns \
            --namespace external-dns \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl annotate serviceaccount external-dns \
            --namespace external-dns \
            eks.amazonaws.com/role-arn="${EXTERNAL_DNS_ROLE_ARN}" \
            --overwrite

      - name: Install ExternalDNS
        run: |
          helm upgrade --install external-dns external-dns/external-dns \
            --namespace external-dns \
            --set provider.name=aws \
            --set serviceAccount.create=false \
            --set serviceAccount.name=external-dns \
            --set domainFilters[0]="${DOMAIN}" \
            --set txtOwnerId=eks-threat-composer \
            --set policy=sync \
            --wait \
            --timeout 10m

      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait \
            --timeout 10m

      - name: Apply ArgoCD application
        run: |
          kubectl apply -f argocd/application.yaml

      - name: Install Prometheus and Grafana
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait \
            --timeout 15m

      - name: Verify platform components
        run: |
          kubectl get pods -n ingress-nginx
          kubectl get pods -n cert-manager
          kubectl get pods -n external-dns
          kubectl get pods -n argocd
          kubectl get pods -n monitoring
          kubectl get clusterissuer letsencrypt-prod
          kubectl get application threat-composer -n argocd
