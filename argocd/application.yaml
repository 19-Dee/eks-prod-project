apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threat-composer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/19-Dee/eks-prod-project.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
